name: Issue Automation
on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: write

jobs:
  process-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Parse issue and extract data
        id: parse
        uses: actions/github-script@v6
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';

            // Check if this is from the issue template
            if (!body.includes('### Branch Creation') && !body.includes('### Assignment')) {
              console.log('Not from the issue template, skipping automation');
              return { skip: true };
            }

            // Parse issue type - look for checked item or extract from body
            let issueType = 'feature';
            const typeMatch = body.match(/### Issue Type\s*\n.*?\n\n(.+)/s);
            if (typeMatch) {
              const typeValue = typeMatch[1].trim().split('\n')[0];
              issueType = typeValue.toLowerCase();
            }

            // Parse version
            let version = 'v1.0.0';
            const versionPatterns = [
              /### Target Version\s*\n.*?\n\n(v\d+\.\d+\.\d+)/i,
              /`(v\d+\.\d+\.\d+)`/i,
              /\b(v\d+\.\d+\.\d+)\b/i
            ];
            for (const pattern of versionPatterns) {
              const match = body.match(pattern);
              if (match) {
                version = match[1];
                break;
              }
            }

            // Parse issue title
            let issueTitle = issue.title.replace(/^\[.*?\]\s*/, '').trim();
            const titleMatch = body.match(/### Issue Title\s*\n.*?\n\n(.+)/s);
            if (titleMatch) {
              const extracted = titleMatch[1].trim().split('\n')[0];
              if (extracted) issueTitle = extracted;
            }

            // Generate branch name automatically
            const slug = issueTitle.toLowerCase()
              .replace(/[^\w\s-]/g, '')
              .replace(/\s+/g, '-')
              .substring(0, 50);
            const branchName = `release/${version}/${issueType}/${slug}`;
            
            // Check options - only create/assign if boxes are CHECKED
            let createBranch = false;  // default false
            let assignToAuthor = false;  // default false
            
            // Check for "Create branch automatically" checkbox
            if (/- \[x\]\s*Create branch automatically/i.test(body)) {
              createBranch = true;
            }
            
            // Check for "Assign to me directly" checkbox
            if (/- \[x\]\s*Assign to me directly/i.test(body)) {
              assignToAuthor = true;
            }

            // Create labels if they don't exist
            // Type label - red color
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: issueType
              });
            } catch (error) {
              if (error.status === 404) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: issueType,
                  color: 'FF0000',
                  description: `${issueType.charAt(0).toUpperCase() + issueType.slice(1)} issue type`
                });
                console.log(`Created type label: ${issueType}`);
              }
            }

            // Version label - blue color
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: version
              });
            } catch (error) {
              if (error.status === 404) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: version,
                  color: '0000FF',
                  description: `Version ${version}`
                });
                console.log(`Created version label: ${version}`);
              }
            }

            // Apply labels to issue
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: [issueType, version]
            });

            // Update issue title with type prefix in UPPERCASE if not already there
            const expectedPrefix = `[${issueType.toUpperCase()}]`;
            if (!issue.title.toLowerCase().startsWith(`[${issueType.toLowerCase()}]`)) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                title: `${expectedPrefix} ${issueTitle}`
              });
            }

            return { 
              skip: false,
              createBranch, 
              assignToAuthor, 
              branchName,
              issueType,
              version
            };

      - name: Checkout repository
        if: ${{ fromJson(steps.parse.outputs.result).skip != true && fromJson(steps.parse.outputs.result).createBranch == true }}
        uses: actions/checkout@v4

      - name: Create branch
        if: ${{ fromJson(steps.parse.outputs.result).skip != true && fromJson(steps.parse.outputs.result).createBranch == true }}
        run: |
          BRANCH="${{ fromJson(steps.parse.outputs.result).branchName }}"
          git fetch origin
          if git ls-remote --exit-code --heads origin "$BRANCH"; then
            echo "Branch $BRANCH already exists on remote."
            exit 0
          fi
          git checkout -b "$BRANCH"
          git push --set-upstream origin "$BRANCH"
          echo "✅ Branch $BRANCH created successfully"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment with branch info
        if: ${{ fromJson(steps.parse.outputs.result).skip != true && fromJson(steps.parse.outputs.result).createBranch == true }}
        uses: actions/github-script@v6
        with:
          script: |
            const branchName = ${{ toJson(fromJson(steps.parse.outputs.result).branchName) }};
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: `✅ Branch \`${branchName}\` has been created automatically.\n\nYou can start working on this issue by checking out the branch:\n\`\`\`bash\ngit fetch origin\ngit checkout ${branchName}\n\`\`\``
            });

      - name: Assign issue to author
        if: ${{ fromJson(steps.parse.outputs.result).skip != true && fromJson(steps.parse.outputs.result).assignToAuthor == true }}
        uses: actions/github-script@v6
        with:
          script: |
            const username = context.payload.issue.user.login;
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              assignees: [username]
            });
            console.log(`✅ Assigned issue to @${username}`);
