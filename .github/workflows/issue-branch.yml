name: Create branch from issue
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: read

jobs:
  create-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Extract version/type and check for branch request
        id: extract
        uses: actions/github-script@v6
        with:
          script: |
            const issue = context.payload.issue;

            // Parse version from various formats
            let version = 'v1.0.0';
            const versionPatterns = [
              /`(v[0-9]+\.[0-9]+\.[0-9]+)`/i,  // in backticks: `v1.0.0`
              /\bv[0-9]+\.[0-9]+\.[0-9]+\b/i,  // standalone: v1.0.0
              /version:?\s*(v[0-9]+\.[0-9]+\.[0-9]+)/i,  // after "Version": v1.0.0
              /\*\*Version\*\*.*?\n.*?(v[0-9]+\.[0-9]+\.[0-9]+)/i  // under Version header
            ];
            
            for (const pattern of versionPatterns) {
              const match = issue.body.match(pattern);
              if (match) {
                version = match[1] || match[0];
                if (!version.startsWith('v')) version = 'v' + version;
                break;
              }
            }

            // Parse checked issue type from checkbox format
            let type = 'feature';
            const typeOptions = ['feature', 'bug', 'chore', 'docs', 'enhancement', 'refactor', 'test', 'perf', 'security'];
            for (const option of typeOptions) {
              const checkedPattern = new RegExp(`- \\[x\\]\\s+${option}`, 'i');
              if (checkedPattern.test(issue.body)) {
                type = option;
                break;
              }
            }

            // Check if checkbox was selected for branch creation
            const branchRequested = /- \[x\]\s+Create branch automatically/i.test(issue.body);

            // Slugify title
            const slug = issue.title.toLowerCase()
              .replace(/[^\w\s-]/g, '')
              .replace(/\s+/g, '-');

            const branchName = `release/${version}/${type}/${slug}`;

            return { branchRequested, branchName };

      - name: Checkout repository
        if: ${{ fromJson(steps.extract.outputs.result).branchRequested == true }}
        uses: actions/checkout@v4

      - name: Create branch if requested
        if: ${{ fromJson(steps.extract.outputs.result).branchRequested == true }}
        run: |
          BRANCH=${{ fromJson(steps.extract.outputs.result).branchName }}
          # fetch remote refs
          git fetch origin
          # if branch already exists on remote, exit successfully
          if git ls-remote --exit-code --heads origin "$BRANCH"; then
            echo "Branch $BRANCH already exists on remote."
            exit 0
          fi
          # create local branch and push to origin
          git checkout -b "$BRANCH"
          git push --set-upstream origin "$BRANCH"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
