name: Issue Labels
on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  apply-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Parse issue and apply labels
        uses: actions/github-script@v6
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';

            // Check if this is from the issue template
            if (!body.includes('### Branch Creation') && !body.includes('### Assignment')) {
              console.log('Not from the issue template, skipping');
              return;
            }

            // Parse issue type
            let issueType = 'feature';
            const typeMatch = body.match(/### Issue Type\s*\n.*?\n\n(.+)/s);
            if (typeMatch) {
              const typeValue = typeMatch[1].trim().split('\n')[0];
              issueType = typeValue.toLowerCase();
            }

            // Parse version
            let version = 'v1.0.0';
            const versionPatterns = [
              /### Target Version\s*\n.*?\n\n(v\d+\.\d+\.\d+)/i,
              /`(v\d+\.\d+\.\d+)`/i,
              /\b(v\d+\.\d+\.\d+)\b/i
            ];
            for (const pattern of versionPatterns) {
              const match = body.match(pattern);
              if (match) {
                version = match[1];
                break;
              }
            }

            // Create type label if it doesn't exist - red color
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: issueType
              });
            } catch (error) {
              if (error.status === 404) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: issueType,
                  color: 'FF0000',
                  description: `${issueType.charAt(0).toUpperCase() + issueType.slice(1)} issue type`
                });
                console.log(`✅ Created type label: ${issueType}`);
              }
            }

            // Create version label if it doesn't exist - blue color
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: version
              });
            } catch (error) {
              if (error.status === 404) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: version,
                  color: '0000FF',
                  description: `Version ${version}`
                });
                console.log(`✅ Created version label: ${version}`);
              }
            }

            // Apply labels to issue
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: [issueType, version]
            });

            console.log(`✅ Applied labels: ${issueType}, ${version}`);
