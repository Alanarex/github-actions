name: Issue
about: Create an issue for any type of work
labels: []
body:
  - type: markdown
    attributes:
      value: |
        ## Issue Template
        Fill out the form below to create an issue. The branch name will be automatically generated based on your selections.
        
        ### Issue Type Descriptions:
        - **feature** - A new feature or functionality to be implemented
        - **bug** - A bug or defect that needs to be fixed
        - **chore** - Maintenance tasks, refactoring, or tooling updates
        - **docs** - Documentation updates or improvements
        - **enhancement** - Improvements to existing features
        - **refactor** - Code restructuring without changing functionality
        - **test** - Adding or updating tests
        - **perf** - Performance improvements
        - **security** - Security fixes or improvements

  - type: dropdown
    id: issue-type
    attributes:
      label: Issue Type
      description: Select the type of issue you want to create (see descriptions above)
      options:
        - feature
        - bug
        - chore
        - docs
        - enhancement
        - refactor
        - test
        - perf
        - security
      default: 0
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Target Version
      description: "Version for this issue (format: v1.0.0)"
      placeholder: "v1.0.0"
      value: "v1.0.0"
    validations:
      required: true
      pattern: "^v\\d+\\.\\d+\\.\\d+$"

  - type: input
    id: issue-title
    attributes:
      label: Issue Title
      description: A clear and concise title for this issue
      placeholder: "e.g., Add user authentication system"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Provide a detailed description of the issue
      placeholder: "Describe what needs to be done, the problem to solve, or the feature to implement..."
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        **Options:** Check the boxes below to enable these features.

  - type: checkboxes
    id: create-branch
    attributes:
      label: Branch Creation
      options:
        - label: "Create branch automatically"

  - type: checkboxes
    id: assign-me
    attributes:
      label: Assignment
      options:
        - label: "Assign to me directly"

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria (Optional)
      description: What needs to be done for this issue to be considered complete?
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
        - [ ] Criterion 3

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context (Optional)
      description: Add any other context, screenshots, or information about the issue
      placeholder: "Any additional information..."
